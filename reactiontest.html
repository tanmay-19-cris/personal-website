<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Reaction Test</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Poppins, sans-serif;
      }

      body {
        min-height: 100vh;
        background: #000;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .game {
        width: 90%;
        max-width: 700px;
        text-align: center;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(15px);
        border: 1px solid #b74b4b;
        border-radius: 25px;
        padding: 40px;
        box-shadow: 0 0 30px #b74b4b55;
      }

      h1 {
        font-size: 45px;
        color: #b74b4b;
        margin-bottom: 20px;
      }

      p {
        font-size: 18px;
        margin-bottom: 20px;
      }

      button {
        padding: 15px 40px;
        border-radius: 30px;
        background: black;
        color: #b74b4b;
        border: 2px solid #b74b4b;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #b74b4b;
        color: black;
        box-shadow: 0 0 25px #b74b4b;
      }

      #box {
        margin-top: 30px;
        height: 250px;
        border-radius: 20px;
        background: #222;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 25px;
        cursor: pointer;
        user-select: none;
        transition: 0.3s;
      }

      #box.wait {
        background: #b74b4b;
      }

      #box.ready {
        background: #39ff88;
        color: black;
        box-shadow: 0 0 30px #39ff88;
      }

      .score {
        margin-top: 25px;
        font-size: 20px;
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 32px;
        }

        #box {
          height: 200px;
        }
      }
    </style>

    <header>
      <div class="logo">Thunder</div>

      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="minigames.html" class="active">Minigames</a>
        <a href="experience.html">Experience</a>
        <a href="extras.html">Extras</a>
      </nav>
    </header>
  </head>

  <body>
    <div class="game">
      <h1>Reaction Test</h1>

      <p>Click the box when it turns green!</p>

      <button onclick="startGame()">Start</button>

      <div id="box">Press Start</div>

      <div class="score">
        Time: <span id="time">0</span> ms
        <br />
        Best: <span id="best">0</span> ms
      </div>
    </div>

    <script>
      let box = document.getElementById("box");
      let timeText = document.getElementById("time");
      let bestText = document.getElementById("best");

      let startTime;
      let timeout;
      let waiting = false;
      let canClick = false;

      let best = localStorage.getItem("reactionBest");

      if (best) {
        bestText.innerHTML = best;
      }

      function startGame() {
        clearTimeout(timeout);

        box.className = "";
        box.innerHTML = "Wait...";
        waiting = true;
        canClick = false;

        let delay = Math.random() * 3000 + 1000;

        timeout = setTimeout(() => {
          box.classList.add("ready");
          box.innerHTML = "CLICK!";
          startTime = Date.now();

          canClick = true;
        }, delay);
      }

      box.onclick = function () {
        if (waiting && !canClick) {
          box.innerHTML = "Too early 😭";
          clearTimeout(timeout);
          waiting = false;
        } else if (canClick) {
          let reaction = Date.now() - startTime;

          timeText.innerHTML = reaction;

          if (!best || reaction < best) {
            best = reaction;
            localStorage.setItem("reactionBest", best);
            bestText.innerHTML = best;
          }

          box.className = "";
          box.innerHTML = "Your time: " + reaction + " ms";

          canClick = false;
          waiting = false;
        }
      };
    </script>
  </body>
</html>
