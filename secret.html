<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Secret</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: #050505;
        color: white;
        font-family: Arial, sans-serif;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        gap: 25px;
        text-align: center;
      }

      .secret-content {
        max-width: 600px;
        padding: 20px;
      }

      .secret-content h1 {
        font-size: 38px;
        margin-bottom: 12px;
      }

      .secret-content p {
        color: #999;
        font-size: 16px;
        line-height: 1.6;
      }

      .warning {
        margin-top: 12px;
        font-size: 13px;
        color: #555;
      }

      .secret-video {
        width: min(800px, 90vw);
        max-height: 70vh;
        object-fit: contain;
        border-radius: 10px;
        background: #000;

        display: none;
      }

      .back-btn {
        padding: 12px 24px;
        background: white;
        color: black;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .back-btn:hover {
        transform: translateY(-2px);
        opacity: 0.85;
      }
    </style>
  </head>

  <body>
    <div class="secret-content" id="secretText">
      <h1>You actually found it.</h1>

      <p>
        Most people never look this far.
        <br />
        I guess you're a little more curious than most.
      </p>

      <p class="warning">
        Click below to return to the main page.
        <br />
        Nothing weird will happen. Probably.
      </p>
    </div>

    <video id="secretVideo" class="secret-video" playsinline preload="auto">
      <source src="rickroll.mp4" type="video/mp4" />
    </video>

    <button id="backBtn" class="back-btn">Go Back</button>

    <script>
      const video = document.getElementById("secretVideo");
      const backBtn = document.getElementById("backBtn");
      const secretText = document.getElementById("secretText");

      backBtn.addEventListener("click", () => {
        secretText.style.display = "none";
        backBtn.style.display = "none";

        video.style.display = "block";

        video.play();
      });

      video.addEventListener("ended", () => {
        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
