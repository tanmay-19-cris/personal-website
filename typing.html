<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Typing Speed Test | Thunder</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: #0b0b0b;
        color: white;
        overflow-x: hidden;
      }

      header {
        position: fixed;
        top: 0;
        left: 0;
        width: 220px;
        height: 100vh;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
        border-right: 1px solid rgba(183, 75, 75, 0.25);
      }

      .logo {
        color: #b74b4b;
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 3rem;
      }

      nav {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      nav a {
        color: white;
        text-decoration: none;
        font-size: 1.1rem;
        transition: 0.3s;
      }

      nav a:hover,
      nav a.active {
        color: #b74b4b;
      }

      main {
        margin-left: 220px;
        min-height: 100vh;
        padding: 4rem 2rem;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      main::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: -1;
      }

      .game-card {
        width: 100%;
        max-width: 900px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(183, 75, 75, 0.25);
        border-radius: 24px;
        padding: 2rem;
        backdrop-filter: blur(10px);
        transition: 0.3s ease;
      }

      .game-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 0 30px rgba(183, 75, 75, 0.25);
      }

      h1 {
        color: #b74b4b;
        font-size: 2.5rem;
        margin-bottom: 1rem;
        text-align: center;
      }

      .stats {
        display: flex;
        justify-content: center;
        gap: 2rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }

      .stat {
        background: #141414;
        border: 1px solid rgba(183, 75, 75, 0.35);
        border-radius: 18px;
        padding: 1rem 1.4rem;
        min-width: 120px;
        text-align: center;
      }

      .stat h2 {
        color: #b74b4b;
        font-size: 1.8rem;
        margin-bottom: 0.25rem;
      }

      .stat p {
        color: #d7d7d7;
        font-size: 0.95rem;
      }

      .quote {
        background: #111;
        border: 1px solid rgba(183, 75, 75, 0.3);
        border-radius: 18px;
        padding: 1.4rem;
        line-height: 2;
        font-size: 1.15rem;
        color: #ddd;
        min-height: 150px;
        margin-bottom: 1.5rem;
      }

      .quote span.correct {
        color: #6ee7a8;
      }

      .quote span.wrong {
        color: #ff7b7b;
        text-decoration: underline;
      }

      .quote span.current {
        background: #b74b4b;
        color: black;
        border-radius: 6px;
        padding: 2px 6px;
      }

      textarea {
        width: 100%;
        height: 150px;
        background: #111;
        border: 1px solid rgba(183, 75, 75, 0.35);
        border-radius: 18px;
        color: white;
        padding: 1rem;
        font-size: 1rem;
        resize: none;
        outline: none;
      }

      textarea:focus {
        border-color: #b74b4b;
        box-shadow: 0 0 15px rgba(183, 75, 75, 0.25);
      }

      .buttons {
        display: flex;
        justify-content: center;
        margin-top: 1.5rem;
      }

      button {
        padding: 0.9rem 1.8rem;
        border-radius: 999px;
        border: 1px solid #b74b4b;
        background: #141414;
        color: white;
        cursor: pointer;
        transition: 0.3s ease;
        font-size: 1rem;
      }

      button:hover {
        background: #b74b4b;
        color: black;
        transform: translateY(-2px);
      }

      @media (max-width: 768px) {
        header {
          position: relative;
          width: 100%;
          height: auto;
          border-right: none;
          border-bottom: 1px solid rgba(183, 75, 75, 0.25);
        }

        main {
          margin-left: 0;
          padding: 2rem 1rem;
        }

        .stats {
          gap: 1rem;
        }

        .quote {
          font-size: 1rem;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="logo">Thunder</div>

      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="minigames.html" class="active">Minigames</a>
        <a href="experience.html">Experience</a>
        <a href="extras.html">Extras</a>
      </nav>
    </header>

    <main>
      <section class="game-card">
        <h1>Typing Speed Test</h1>

        <div class="stats">
          <div class="stat">
            <h2 id="timer">60</h2>
            <p>Seconds</p>
          </div>

          <div class="stat">
            <h2 id="wpm">0</h2>
            <p>WPM</p>
          </div>

          <div class="stat">
            <h2 id="accuracy">100%</h2>
            <p>Accuracy</p>
          </div>
        </div>

        <div class="quote" id="quote"></div>

        <textarea id="input" placeholder="Start typing here..."></textarea>

        <div class="buttons">
          <button id="restart">Restart</button>
        </div>
      </section>
    </main>

    <script>
      const quotes = [
        "The quick brown fox jumps over the lazy dog while coding through the night and learning new skills every single day.",
        "Practice makes progress and every line of code teaches something valuable about creativity logic and persistence.",
        "Building projects is one of the fastest ways to improve your programming skills and understand how real websites work.",
        "Consistency beats motivation when learning web development game development and any creative skill that takes time.",
        "Typing faster helps you focus on ideas instead of the keyboard and makes coding feel smoother and more enjoyable.",
      ];

      const quoteEl = document.getElementById("quote");
      const inputEl = document.getElementById("input");
      const timerEl = document.getElementById("timer");
      const wpmEl = document.getElementById("wpm");
      const accuracyEl = document.getElementById("accuracy");
      const restartBtn = document.getElementById("restart");

      let quote = "";
      let time = 60;
      let timer = null;
      let started = false;

      function loadQuote() {
        quote = quotes[Math.floor(Math.random() * quotes.length)];
        quoteEl.innerHTML = quote
          .split("")
          .map((c) => `<span>${c}</span>`)
          .join("");
        inputEl.value = "";
        time = 60;
        timerEl.textContent = time;
        wpmEl.textContent = "0";
        accuracyEl.textContent = "100%";
        started = false;
        clearInterval(timer);
        inputEl.disabled = false;
        inputEl.focus();
      }

      function startTimer() {
        if (started) return;
        started = true;
        timer = setInterval(() => {
          time--;
          timerEl.textContent = time;
          if (time <= 0) {
            clearInterval(timer);
            inputEl.disabled = true;
            calculateStats();
          }
        }, 1000);
      }

      function calculateStats() {
        const typed = inputEl.value;
        const words = typed.trim().split(/\\s+/).filter(Boolean).length;
        const minutes = (60 - time) / 60 || 1;
        const wpm = Math.round(words / minutes);

        let correct = 0;
        for (let i = 0; i < typed.length; i++) {
          if (typed[i] === quote[i]) correct++;
        }

        const accuracy = typed.length
          ? Math.round((correct / typed.length) * 100)
          : 100;

        wpmEl.textContent = wpm;
        accuracyEl.textContent = accuracy + "%";
      }

      inputEl.addEventListener("input", () => {
        startTimer();

        const typed = inputEl.value;
        const spans = quoteEl.querySelectorAll("span");

        let correct = 0;

        spans.forEach((span, index) => {
          const char = typed[index];

          span.classList.remove("correct", "wrong", "current");

          if (char == null) {
            if (index === typed.length) span.classList.add("current");
          } else if (char === quote[index]) {
            span.classList.add("correct");
            correct++;
          } else {
            span.classList.add("wrong");
          }
        });

        const words = typed.trim().split(/\\s+/).filter(Boolean).length;
        const minutes = Math.max((60 - time) / 60, 1 / 60);
        wpmEl.textContent = Math.round(words / minutes);

        const accuracy = typed.length
          ? Math.round((correct / typed.length) * 100)
          : 100;

        accuracyEl.textContent = accuracy + "%";
      });

      restartBtn.addEventListener("click", loadQuote);

      loadQuote();
    </script>
  </body>
</html>
