<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucky Draw</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: black;
        color: white;
      }

      section {
        min-height: 100vh;
        margin-left: 220px;
        padding: 3rem;
      }

      .lucky-wrapper {
        max-width: 850px;
        margin: 0 auto;
        text-align: center;
      }

      .lucky-wrapper h1 {
        font-size: 4rem;
        margin-bottom: 0.5rem;
      }

      .lucky-wrapper p {
        color: #aaa;
        margin-bottom: 2rem;
        font-size: 1.3rem;
      }

      .prize-box {
        width: 100%;
        height: 130px;
        border: 2px solid #b74b4b;
        border-radius: 2rem;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2rem;
        font-weight: 600;
        background: #111;
        box-shadow: 0 0 20px rgba(183, 75, 75, 0.2);
        margin-bottom: 1rem;
        transition: 0.3s ease;
      }

      .rarity {
        font-size: 1.4rem;
        color: #b74b4b;
        margin-bottom: 2rem;
        font-weight: 600;
      }

      .progress {
        width: 100%;
        height: 10px;
        background: #222;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 2rem;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        background: #b74b4b;
        box-shadow: 0 0 15px #b74b4b;
      }

      .btn {
        display: inline-block;
        padding: 1rem 2.8rem;
        background: black;
        border-radius: 4rem;
        font-size: 1.6rem;
        color: #b74b4b;
        letter-spacing: 0.2rem;
        font-weight: 600;
        border: 2px solid #b74b4b;
        transition: 0.3s ease;
        cursor: pointer;
      }

      .btn:hover {
        transform: scale(1.08);
        background: #b74b4b;
        color: black;
        box-shadow: 0 0 25px #b74b4b;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        margin-top: 3rem;
      }

      .stat-card {
        border: 2px solid #b74b4b;
        border-radius: 1.5rem;
        padding: 1.5rem;
        background: #111;
      }

      .stat-card h3 {
        color: #b74b4b;
        font-size: 1.2rem;
        margin-bottom: 0.8rem;
      }

      .stat-card div {
        font-size: 1.8rem;
        font-weight: 600;
      }

      .reset-btn {
        margin-top: 2rem;
      }

      .flash {
        animation: flash 0.08s linear infinite;
      }

      @keyframes flash {
        0% {
          box-shadow: 0 0 10px #b74b4b;
        }
        50% {
          box-shadow: 0 0 35px #b74b4b;
        }
        100% {
          box-shadow: 0 0 10px #b74b4b;
        }
      }

      .winner {
        animation: pop 0.4s ease;
      }

      @keyframes pop {
        0% {
          transform: scale(0.85);
        }
        60% {
          transform: scale(1.08);
        }
        100% {
          transform: scale(1);
        }
      }

      @media (max-width: 995px) {
        section {
          margin-left: 0;
          padding: 2rem 1.2rem;
        }

        .lucky-wrapper h1 {
          font-size: 3rem;
        }

        .stats {
          grid-template-columns: 1fr 1fr;
        }

        .prize-box {
          font-size: 1.5rem;
          height: 110px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <i class="fa-solid fa-bars menu-icon" id="menu-icon"></i>
      <nav id="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="minigames.html" class="active">Minigames</a>
        <a href="experience.html">Experience</a>
        <a href="extras.html">Extras</a>
      </nav>
    </header>

    <section>
      <div class="lucky-wrapper">
        <h1>Lucky <span>Draw</span></h1>
        <p>Press the button and test ur luck.</p>

        <div class="prize-box" id="prizeBox">Click Draw</div>
        <div class="rarity" id="rarityText">Rarity: ???</div>

        <div class="progress">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <button class="btn" id="drawBtn">DRAW</button>

        <div class="stats">
          <div class="stat-card">
            <h3>Total Draws</h3>
            <div id="drawCount">0</div>
          </div>

          <div class="stat-card">
            <h3>Streak</h3>
            <div id="streak">0</div>
          </div>

          <div class="stat-card">
            <h3>Best Prize</h3>
            <div id="bestPrize">None</div>
          </div>

          <div class="stat-card">
            <h3>Jackpot Chance</h3>
            <div>2%</div>
          </div>
        </div>

        <button class="btn reset-btn" id="resetBtn">RESET</button>
      </div>
    </section>

    <script>
      const prizes = [
        { name: "Nothing 😭", rarity: "Common", score: 0 },
        { name: "Coal 🪨", rarity: "Common", score: 1 },
        { name: "Iron Ingot ⛓️", rarity: "Common", score: 2 },
        { name: "Emerald 💚", rarity: "Rare", score: 3 },
        { name: "Golden Apple 🍏", rarity: "Rare", score: 4 },
        { name: "TNT 🧨", rarity: "Epic", score: 5 },
        { name: "Enchanted Book 📘", rarity: "Epic", score: 6 },
        { name: "Beacon ✨", rarity: "Legendary", score: 7 },
        { name: "Totem of Undying ⚱️", rarity: "Legendary", score: 8 },
        { name: "Netherite Ingot 🍫", rarity: "Mythic", score: 9 },
        { name: "Diamond 💎", rarity: "Mythic", score: 10 },
        { name: "JACKPOT! 1000 Coins 🪙", rarity: "JACKPOT", score: 11 },
      ];

      const prizeBox = document.getElementById("prizeBox");
      const rarityText = document.getElementById("rarityText");
      const progressBar = document.getElementById("progressBar");
      const drawBtn = document.getElementById("drawBtn");

      let total = 0;
      let streak = 0;
      let best = -1;

      function getPrize() {
        const r = Math.random() * 100;
        if (r < 25) return prizes[0];
        if (r < 45) return prizes[1];
        if (r < 60) return prizes[2];
        if (r < 72) return prizes[3];
        if (r < 82) return prizes[4];
        if (r < 89) return prizes[5];
        if (r < 94) return prizes[6];
        if (r < 97) return prizes[7];
        if (r < 98.5) return prizes[8];
        if (r < 99.3) return prizes[9];
        if (r < 99.8) return prizes[10];
        return prizes[11];
      }

      drawBtn.onclick = () => {
        drawBtn.disabled = true;
        prizeBox.classList.add("flash");
        progressBar.style.width = "0%";

        let p = 0;

        const spin = setInterval(() => {
          const temp = prizes[Math.floor(Math.random() * prizes.length)];
          prizeBox.textContent = temp.name;
          rarityText.textContent = "Rarity: " + temp.rarity;

          p += 5;
          progressBar.style.width = p + "%";

          if (p >= 100) {
            clearInterval(spin);

            const final = getPrize();

            prizeBox.textContent = final.name;
            rarityText.textContent = "Rarity: " + final.rarity;

            prizeBox.classList.remove("flash");
            prizeBox.classList.add("winner");

            total++;
            streak++;

            document.getElementById("drawCount").textContent = total;
            document.getElementById("streak").textContent = streak;

            if (final.score > best) {
              best = final.score;
              document.getElementById("bestPrize").textContent = final.name;
            }

            drawBtn.disabled = false;
          }
        }, 70);
      };

      document.getElementById("resetBtn").onclick = () => {
        total = 0;
        streak = 0;
        best = -1;

        document.getElementById("drawCount").textContent = "0";
        document.getElementById("streak").textContent = "0";
        document.getElementById("bestPrize").textContent = "None";
        prizeBox.textContent = "Click Draw";
        rarityText.textContent = "Rarity: ???";
        progressBar.style.width = "0%";
      };
    </script>
  </body>
</html>
