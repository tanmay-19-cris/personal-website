    <style>
        /* Import Minecraft-like pixel font */
        @import url('https://cdnfonts.com');

        body {
            background-color: #2c2c2c;
            background-image: radial-gradient(#4a4a4a 1px, transparent 0), radial-gradient(#4a4a4a 1px, transparent 0);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
            color: #ffffff;
            font-family: 'Minecraftia', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .picker-container {
            background-color: #c6c6c6;
            border: 4px solid #555555;
            box-shadow: inset -4px -4px 0px #3a3a3a, inset 4px 4px 0px #ffffff;
            padding: 30px;
            text-align: center;
            width: 320px;
        }

        h1 {
            color: #373737;
            font-size: 18px;
            text-shadow: 2px 2px #ffffff;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* Minecraft Hotbar Slot styling */
        .item-display-slot {
            width: 80px;
            height: 80px;
            background-color: #8b8b8b;
            border: 4px solid #373737;
            box-shadow: inset 4px 4px 0px #4a4a4a, inset -4px -4px 0px #ffffff;
            margin: 0 auto 25px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-emoji {
            font-size: 42px;
            user-select: none;
        }

        .item-name {
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.75);
            padding: 6px 12px;
            border: 2px solid #555555;
            font-size: 12px;
            min-height: 18px;
            margin-bottom: 20px;
            display: inline-block;
        }

        /* Minecraft Styled Button */
        .mc-button {
            width: 100%;
            background-color: #9e9e9e;
            color: #e0e0e0;
            border: 4px solid #000000;
            box-shadow: inset -4px -4px 0px #565656, inset 4px 4px 0px #dbdbdb;
            padding: 12px 0;
            font-family: 'Minecraftia', sans-serif;
            font-size: 14px;
            cursor: pointer;
            text-shadow: 2px 2px #000000;
        }

        .mc-button:hover {
            background-color: #7ca13d;
            color: #ffffa0;
            box-shadow: inset -4px -4px 0px #4a6224, inset 4px 4px 0px #b1dd5b;
        }

        .mc-button:active {
            box-shadow: inset 4px 4px 0px #4a6224, inset -4px -4px 0px #b1dd5b;
            padding: 14px 0 10px 0;
        }
    </style>
</head>
