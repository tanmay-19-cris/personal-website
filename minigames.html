        <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
        }
        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
        }
        canvas {
            display: block;
            cursor: none;
        }
    </style>
</head>
<body>

    <div id="score-board">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        let score = 0;
        let gameOver = false;

        window.addEventListener("mousemove", (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        const segmentRadius = 12;
        let snake = [];
        const initialLength = 15;

        for (let i = 0; i < initialLength; i++) {
            snake.push({ x: canvas.width / 2, y: canvas.height / 2 });
        }

        let food = { x: 0, y: 0, radius: 8 };
        function spawnFood() {
            food.x = Math.random() * (canvas.width - 40) + 20;
            food.y = Math.random() * (canvas.height - 40) + 20;
        }
        spawnFood();

        function update() {
            if (gameOver) return;

            let head = snake[0];
            let targetX = mouse.x;
            let targetY = mouse.y;
            
            head.x += (targetX - head.x) * 0.15;
            head.y += (targetY - head.y) * 0.15;

            for (let i = 1; i < snake.length; i++) {
                let prev = snake[i - 1];
                let curr = snake[i];
                
                let dx = prev.x - curr.x;
                let dy = prev.y - curr.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                let minDistance = segmentRadius * 1.2; 
                if (distance > minDistance) {
                    curr.x += dx * 0.35;
                    curr.y += dy * 0.35;
                }
            }

            let dxFood = head.x - food.x;
            let dyFood = head.y - food.y;
            let distanceToFood = Math.sqrt(dxFood * dxFood + dyFood * dyFood);

            if (distanceToFood < segmentRadius + food.radius) {
                score++;
                scoreElement.innerText = score;
                spawnFood();
                
                for (let i = 0; i < 3; i++) {
                    snake.push({ x: snake[snake.length - 1].x, y: snake[snake.length - 1].y });
                }
            }

            for (let i = 5; i < snake.length; i++) {
                let dxSelf = head.x - snake[i].x;
                let dySelf = head.y - snake[i].y;
                let distanceToSelf = Math.sqrt(dxSelf * dxSelf + dySelf * dySelf);

                if (distanceToSelf < segmentRadius) {
                    gameOver = true;
                    alert(`Game Over! Final Score: ${score}. Click OK to restart.`);
                    resetGame();
                    break;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.arc(food.x, food.y, food.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#ff3366";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff3366";
            ctx.fill();
            ctx.closePath();

            ctx.shadowBlur = 0;

            for (let i = snake.length - 1; i >= 0; i--) {
                ctx.beginPath();
                ctx.arc(snake[i].x, snake[i].y, segmentRadius, 0, Math.PI * 2);
                
                if (i === 0) {
                    ctx.fillStyle = "#00ffcc"; 
                } else {
                    let greenValue = Math.max(100, 255 - (i * 8));
                    ctx.fillStyle = `rgb(0, ${greenValue}, 150)`;
                }
                
                ctx.fill();
                ctx.closePath();
            }
        }

        function resetGame() {
            score = 0;
            scoreElement.innerText = score;
            snake = [];
            for (let i = 0; i < initialLength; i++) {
                snake.push({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
            }
            mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
            spawnFood();
            gameOver = false;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>



  </body>
</html>
