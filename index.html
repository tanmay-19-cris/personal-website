<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Portfolio Website</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: #0b0b0b;
        color: white;
        overflow-x: hidden;
      }

      header {
        position: fixed;
        top: 0;
        left: 0;
        width: 220px;
        height: 100vh;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
        border-right: 1px solid rgba(183, 75, 75, 0.25);
      }

      .logo {
        color: #b74b4b;
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 3rem;
      }

      nav {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      nav a {
        color: white;
        text-decoration: none;
        font-size: 1.1rem;
        transition: 0.3s;
      }

      nav a:hover,
      nav a.active {
        color: #b74b4b;
      }

      main {
        margin-left: 220px;
        min-height: 100vh;
        padding: 4rem 2rem;
        position: relative;
      }

      main::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: -1;
      }

      .hero {
        text-align: center;
        margin-bottom: 3rem;
      }

      .hero h1 {
        font-size: 3rem;
        margin-bottom: 0.5rem;
      }

      .hero p {
        color: #cfcfcf;
        max-width: 800px;
        margin: 0 auto;
        line-height: 1.8;
      }

      .projects {
        max-width: 1000px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      .project-card {
        display: flex;
        align-items: flex-start;
        gap: 2rem;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(183, 75, 75, 0.25);
        border-radius: 24px;
        padding: 2rem;
        backdrop-filter: blur(10px);
        transition: 0.3s ease;
      }

      .project-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 0 30px rgba(183, 75, 75, 0.25);
      }

      .project-icon {
        width: 90px;
        height: 90px;
        border-radius: 20px;
        background: rgba(183, 75, 75, 0.12);
        border: 1px solid rgba(183, 75, 75, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        flex-shrink: 0;
      }

      .project-content {
        flex: 1;
      }

      .project-content h2 {
        color: #b74b4b;
        font-size: 2rem;
        margin-bottom: 1rem;
      }

      .project-content p {
        color: #ddd;
        line-height: 1.9;
        margin-bottom: 1.2rem;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
      }

      .tags span {
        background: #141414;
        border: 1px solid #b74b4b;
        color: white;
        padding: 0.5rem 0.9rem;
        border-radius: 999px;
        font-size: 0.9rem;
        transition: 0.3s;
      }

      .tags span:hover {
        background: #b74b4b;
        color: black;
        transform: scale(1.05);
      }

      @media (max-width: 768px) {
        header {
          position: relative;
          width: 100%;
          height: auto;
          border-right: none;
          border-bottom: 1px solid rgba(183, 75, 75, 0.25);
        }

        main {
          margin-left: 0;
          padding: 2rem 1rem;
        }

        .hero h1 {
          font-size: 2.3rem;
        }

        .project-card {
          flex-direction: column;
        }

        .tags {
          justify-content: center;
        }
      }
    </style>
  </head>

  <body>
    <div class="intro">
      <h1 class="logo-header">
        <span class="logo">Thun</span><span class="logo">der</span>

    </div>

        </div>
        <a href="mailto:tanmayshet2010@gmail.com" class="btn">Contact me</a>

    <script src="app.js"></script>
  </body>
</html>
