<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THUNDER VAULT</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Share Tech Mono", monospace;
      }

      body {
        background: #050505;
        color: #ff4d4d;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      .vault {
        width: min(900px, 90vw);
        border: 2px solid #ff3b3b;
        background: #0a0a0a;
        padding: 30px;
        box-shadow: 0 0 30px rgba(255, 59, 59, 0.3);
      }

      h1 {
        color: #ff3b3b;
        margin-bottom: 10px;
        font-size: 2.5rem;
      }

      p {
        color: #d84a4a;
        margin-bottom: 25px;
      }

      .folder {
        border: 1px solid rgba(255, 59, 59, 0.3);
        padding: 18px;
        margin-bottom: 16px;
        cursor: pointer;
        transition: 0.25s;
      }

      .folder:hover {
        background: rgba(255, 59, 59, 0.08);
        box-shadow: 0 0 15px rgba(255, 59, 59, 0.2);
      }

      .folder h3 {
        color: #ff6b6b;
        margin-bottom: 6px;
        font-size: 1.2rem;
      }

      .folder span {
        color: #d84a4a;
        font-size: 0.95rem;
      }

      .back {
        display: inline-block;
        margin-top: 10px;
        color: #ff6b6b;
        text-decoration: none;
        border: 1px solid #ff3b3b;
        padding: 10px 14px;
        border-radius: 999px;
        transition: 0.25s;
      }

      .back:hover {
        background: #ff3b3b;
        color: #000;
      }

      /* Rickroll Overlay */
      .rickroll-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
        justify-content: center;
        align-items: center;
        z-index: 999999;
      }

      .rickroll-overlay video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="vault">
      <h1>THUNDER VAULT</h1>
      <p>ACCESS LEVEL: ROOT</p>

      <div class="folder" onclick="openFile('CLASSIFIED_PROJECTS')">
        <h3>CLASSIFIED_PROJECTS/</h3>
        <span>Top secret portfolio builds</span>
      </div>

      <div class="folder" onclick="openFile('EXPERIMENTS')">
        <h3>EXPERIMENTS/</h3>
        <span>Random prototypes and unfinished ideas</span>
      </div>

      <div class="folder" onclick="openFile('DO_NOT_OPEN')">
        <h3>DO_NOT_OPEN/</h3>
        <span>Definitely do not click this</span>
      </div>

      <a class="back" href="index.html">RETURN TO MAINFRAME</a>
    </div>

    <!-- Rickroll Overlay -->
    <div id="rickroll" class="rickroll-overlay">
      <video id="rickVideo" preload="auto">
        <source src="rickroll.mp4" type="video/mp4" />
      </video>
    </div>

    <script>
      if (localStorage.getItem("hackMode") !== "true") {
        document.body.innerHTML = `
        <div style="text-align:center;">
          <h1 style="color:#ff3b3b;font-family:'Share Tech Mono', monospace;">ACCESS DENIED</h1>
          <p style="color:#d84a4a;font-family:'Share Tech Mono', monospace;">Enable Hack Mode first.</p>
          <a href="index.html" style="color:#ff6b6b;font-family:'Share Tech Mono', monospace;">Return</a>
        </div>
      `;
      }

      const rickroll = document.getElementById("rickroll");
      const rickVideo = document.getElementById("rickVideo");

      function openFile(name) {
        // Fake loading screen
        document.querySelector(".vault").innerHTML = `
        <h1 style="color:#ff3b3b">DECRYPTING...</h1>
        <p style="color:#d84a4a">Opening ${name}...</p>
      `;

        setTimeout(() => {
          rickroll.style.display = "flex";

          rickVideo.currentTime = 0;
          rickVideo.volume = 1;
          rickVideo.play();

          rickVideo.onended = () => {
            rickroll.style.display = "none";
            location.reload();
          };
        }, 1500);
      }
    </script>
  </body>
</html>
