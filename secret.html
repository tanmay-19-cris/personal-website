<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Thunder Vault</title>

    <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Share Tech Mono', monospace;
}

body {
  background: #050505;
  color: #6dffb3;
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 100vh;
  padding: 40px 20px;
}

/* faint grid */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(109,255,179,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(109,255,179,0.04) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
}

/* scan line */
.scan {
  position: fixed;
  inset: 0;
  background: linear-gradient(
    to bottom,
    transparent,
    rgba(109,255,179,0.05),
    transparent
  );
  animation: scan 6s linear infinite;
  pointer-events: none;
}

@keyframes scan {
  from { transform: translateY(-100%); }
  to   { transform: translateY(100%); }
}

.panel {
  width: min(850px, 92vw);
  margin: 40px auto;
  padding: 28px;
  border: 1px solid rgba(109,255,179,0.35);
  border-radius: 12px;
  background: rgba(8, 8, 8, 0.88);
  box-shadow: 0 0 18px rgba(109,255,179,0.12);
}

h1 {
  text-align: center;
  font-size: 42px;
  color: #8dffc8;
  margin-bottom: 22px;
  letter-spacing: 2px;
  text-shadow: 0 0 6px rgba(109,255,179,0.35);
}

.type {
  white-space: pre-wrap;
  line-height: 1.7;
  font-size: 17px;
  color: #74ffb9;
  min-height: 260px;
}

.cursor {
  display: inline-block;
  animation: blink .8s infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

.btns {
  margin-top: 24px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.btns a {
  text-decoration: none;
  color: #74ffb9;
  border: 1px solid rgba(109,255,179,0.4);
  padding: 11px 16px;
  border-radius: 8px;
  transition: 0.2s ease;
}

.btns a:hover {
  background: rgba(109,255,179,0.12);
  border-color: #74ffb9;
}

.footer {
  margin-top: 22px;
  font-size: 14px;
  color: #6dffb3;
  opacity: 0.7;
}

/* small screens */
@media (max-width: 600px) {
  .panel {
    padding: 22px;
  }

  h1 {
    font-size: 32px;
  }

  .type {
    font-size: 15px;
  }

  .btns {
    flex-direction: column;
  }

  .btns a {
    width: 100%;
    text-align: center;
  }
}
    </style>
  </head>

      const s = document.getElementById('vaultSound');

      return false;

    Download ???

<!-- Footer -->
<div class="footer">Hidden page unlocked by Spider-Man protocol</div>

<script>
const text = `
> Initializing hidden protocol...
> Authentication bypass detected
> Welcome, Sir
> Access Level: ADMIN
> Spider Trigger: VERIFIED
> Vault Status: OPEN

This page was never linked anywhere.
If you are seeing this, you found the Nothing.

Chaos Mode: ENABLED

DM me the word 'Frog' for a special surprise.
Enjoy the vault.
`;

const terminal = document.getElementById("terminal");
let i = 0;

function type() {
  if (i < text.length) {
    terminal.innerHTML += text.charAt(i);
    i++;
    setTimeout(type, 18);
  } else {
    terminal.innerHTML += '<span class="cursor">█</span>';
  }
}

type();
</script>
